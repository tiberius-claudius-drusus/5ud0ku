<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>5ud0ku</title>
<meta name="description" content="Portage PWA de GNOME Sudoku.">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* CSS en ligne : le nginx du portail sert les .css en application/octet-stream (Chrome refuse la feuille). */
:root{
  --bg:#f5f6f8;--fg:#1c1f26;--muted:#6a7080;--panel:#fff;--line:#c4c9d4;--line-strong:#1c1f26;
  --cell:#fff;--given:#1c1f26;--entry:#2456b8;--sel:#cfe0ff;--hl:#e9eef8;--same:#d6ecd8;
  --err:#c62828;--errbg:#fbe3e3;--acc:#2456b8;--accfg:#fff;--shadow:0 1px 3px rgba(0,0,0,.18);
  --test:#1c8a3a;--pad-note:#fff0a8;--pad-note-line:#c9a800;--pad-test:#d3f0d9;--pad-test-line:#2e9e4a;
  --zoom:1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181d;--fg:#e6e8ee;--muted:#9097a8;--panel:#20232b;--line:#3a3f4d;--line-strong:#c9cedb;
    --cell:#1d2027;--given:#e6e8ee;--entry:#7fa6ff;--sel:#2c4170;--hl:#262b38;--same:#27402c;
    --err:#ff6b6b;--errbg:#4a2326;--acc:#7fa6ff;--accfg:#10131a;--shadow:0 1px 3px rgba(0,0,0,.6);
    --test:#6fe08c;--pad-note:#4d4210;--pad-note-line:#b89b00;--pad-test:#1b4026;--pad-test-line:#3fae5f;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d;--fg:#e6e8ee;--muted:#9097a8;--panel:#20232b;--line:#3a3f4d;--line-strong:#c9cedb;
  --cell:#1d2027;--given:#e6e8ee;--entry:#7fa6ff;--sel:#2c4170;--hl:#262b38;--same:#27402c;
  --err:#ff6b6b;--errbg:#4a2326;--acc:#7fa6ff;--accfg:#10131a;--shadow:0 1px 3px rgba(0,0,0,.6);
  --test:#6fe08c;--pad-note:#4d4210;--pad-note-line:#b89b00;--pad-test:#1b4026;--pad-test-line:#3fae5f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:var(--bg-image,none);background-attachment:fixed;color:var(--fg);
  font-size:16px;line-height:1.35;font-family:var(--ui-font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:var(--btn-radius,10px);
  -webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none);
  min-height:44px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
#app{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:100%;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* Bandeau de la partie : même présentation que 1-5731N : menu à gauche, puis le temps (accent, gras) avec le code de la grille et la
   difficulté en petit dessous, et l'action à droite (ici la pause). Le chronomètre est toujours affiché : ce n'est pas une option. */
header{width:min(100%,560px);display:flex;align-items:center;gap:8px}
header .grow{flex:1}
#g-info{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.1;min-width:0}
#clock{font-variant-numeric:tabular-nums;font-size:1.15rem;color:var(--acc);font-weight:600}
#g-level{display:block;padding:2px 0 0;font:600 .64rem/1 var(--ui-font,system-ui,sans-serif);letter-spacing:.04em;color:var(--muted)}
.iconbtn{width:44px;padding:0}
#play{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#boardwrap{position:relative;width:min(100%,560px,calc(100vh - 354px));width:min(100%,560px,calc(100dvh - 354px));min-width:270px;aspect-ratio:1}
#side{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,560px)}
#board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));width:100%;height:100%;border:3px solid var(--line-strong);
  border-radius:var(--board-radius,6px);background:var(--line);gap:1px;overflow:hidden;box-shadow:var(--shadow);
  -webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none)}
.cell{-webkit-backdrop-filter:none;backdrop-filter:none;position:relative;display:flex;align-items:center;justify-content:center;margin:0;padding:0;min-height:0;border:0;border-radius:0;
  background:var(--cell);color:var(--entry);font-family:var(--digit-font,inherit);font-size:calc(clamp(1.1rem,6.2vw,2.1rem) * var(--zoom));font-weight:600;
  font-variant-numeric:tabular-nums;cursor:pointer}
.cell.given{color:var(--given);font-weight:700}
.cell.test{color:var(--test)}
.cell.test.err .v{color:var(--test)}
.cell.hl{background:var(--hl)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.err .v{color:var(--err)}
.cell.err{background:var(--errbg)}
.cell.cb{border-right:2px solid var(--line-strong);margin-right:-1px}
.cell.rb{border-bottom:2px solid var(--line-strong);margin-bottom:-1px}
.m{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%;padding:1px;
  font-size:calc(clamp(.5rem,2.5vw,.85rem) * var(--zoom));font-weight:500;line-height:1;color:var(--muted)}
.m i{font-style:normal;display:flex;align-items:center;justify-content:center}
.m i.err{color:var(--err);text-decoration:line-through}
.m i.on-same{color:var(--acc);font-weight:700}
#pause{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--panel);border:3px solid var(--line-strong);border-radius:6px;font-size:1.2rem}
#pause[hidden]{display:none}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 80%,transparent);
  border-radius:6px;font-size:1.1rem}
#busy[hidden]{display:none}
#tools{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;min-height:52px;padding:4px 2px}
#tools button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#tools #b-notes[aria-pressed="true"]{background:var(--pad-note);color:var(--fg);border-color:var(--pad-note-line)}
#tools #b-test[aria-pressed="true"]{background:var(--pad-test);color:var(--fg);border-color:var(--pad-test-line)}
/* Pavé de saisie : un carré de 3×3 touches. Bleu en saisie normale, jaune en mode notes (les chiffres déjà notés dans la
   case sont en négatif), vert en mode essai (seuls les chiffres notés sont présents ; l'essai choisi est en négatif). */
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:min(100%,270px);padding:9px;border-radius:16px;
  border:2px solid var(--acc);background:var(--panel)}
#pad button{padding:0;min-height:0;aspect-ratio:1.7;font-family:var(--digit-font,inherit);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;background:var(--cell)}
#pad.notes{background:var(--pad-note);border-color:var(--pad-note-line)}
#pad.test{background:var(--pad-test);border-color:var(--pad-test-line)}
#pad.notes button,#pad.test button{background:transparent;border-color:currentColor}
#pad button.on{background:var(--fg) !important;color:var(--bg);border-color:var(--fg)}
#pad button.absent{visibility:hidden}
#padhint{margin:0;min-height:1.3em;font-size:.85rem;color:var(--muted);text-align:center}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  #play{flex-direction:row;align-items:flex-start;justify-content:center;gap:28px}
  #boardwrap{width:min(calc(100vh - 130px),640px);width:min(calc(100dvh - 130px),640px)}
  #side{width:320px;padding-top:6px}
}
dialog{border:1px solid var(--line-strong);border-radius:calc(var(--btn-radius,10px) + 4px);background:var(--panel);color:var(--fg);padding:18px;max-width:min(92vw,440px);width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35);
  -webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none);font-family:inherit}
dialog::backdrop{background:var(--veil,rgba(0,0,0,.45))}
dialog h2{margin:0 0 10px;font-size:1.15rem;letter-spacing:var(--h2-spacing,normal);text-transform:var(--h2-transform,none)}
dialog p{margin:8px 0}
.menu{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row button{flex:1}
.opt{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:44px}
.opt input[type=checkbox]{width:22px;height:22px;flex:none}
.opt select{margin-left:auto;font:inherit;padding:6px;border-radius:8px;min-height:40px;background:var(--cell);color:var(--fg);border:1px solid var(--line)}
.diffs{display:flex;flex-direction:column;gap:6px}
.diffs label{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;min-height:48px;cursor:pointer}
.diffs label small{margin-left:auto;color:var(--muted)}
.diffs input{width:20px;height:20px;flex:none}
textarea{width:100%;min-height:90px;font:14px/1.3 ui-monospace,Consolas,monospace;background:var(--cell);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.err-msg{color:var(--err);margin:6px 0 0}
.err-msg[hidden]{display:none}
.code{font:14px ui-monospace,Consolas,monospace;word-break:break-all;background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:8px}
a{color:var(--acc)}
/* Page d'accueil : visible seulement hors partie (body[data-view="home"]) ; en partie, c'est la grille qui l'est. */
body[data-view="game"] #home{display:none}
body[data-view="home"] header,body[data-view="home"] #play{display:none}
/* Accueil calqué sur celui de 1-5731N : colonne centrée (la marge automatique du logo et celle du pied de page répartissent
   l'espace), logo de 21 % de la hauteur, titre de 2,6 rem en couleur d'accent, menu large de min(78vw, 300px) avec 12 px entre
   des boutons de 1,15 rem et 12 px de marge intérieure, et en bas deux lignes d'information (version, puis inspiration). */
body[data-view="home"] #app{min-height:100vh;min-height:100dvh;padding-top:max(0px,env(safe-area-inset-top));padding-bottom:max(0px,env(safe-area-inset-bottom))}
#home{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:0;padding:0 10px;text-align:center}
.logo{display:block;flex:none;height:clamp(96px,21vh,200px);height:clamp(96px,21dvh,200px);aspect-ratio:1;width:auto;margin:auto 0 4px;filter:drop-shadow(var(--shadow-logo,0 2px 6px rgba(0,0,0,.18)))}
.logo svg{width:100%;height:100%;display:block}
#home h1{margin:0;font-size:2.6rem;color:var(--acc);letter-spacing:.04em;font-weight:700;line-height:1.1}
.homemenu{display:flex;flex-direction:column;gap:12px;width:min(78vw,300px);margin-top:1.4em}
.big{width:100%;font-size:1.15rem;padding:12px}
.big[hidden]{display:none}
.foot{flex:none;margin:auto 0 0;padding:18px 12px 10px;font-size:.72rem;line-height:1.5;color:var(--muted);text-align:center}
.foot a{color:inherit}
#h-ver{direction:ltr;unicode-bidi:isolate}   /* ligne technique à jetons latins : sens fixe, même en arabe */
dialog>.row:last-child{position:sticky;bottom:-18px;background:var(--panel);padding-top:8px;margin-top:10px}  /* « Fermer » reste visible quand le dialogue défile */
.hint{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.lbl{margin:12px 0 4px;font-size:.85rem;color:var(--muted)}
.gcode{display:block;max-width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:0;min-width:0;padding:3px 0 0;font:600 .64rem/1 ui-monospace,Consolas,monospace;border:0;background:transparent;box-shadow:none;color:var(--muted);
  letter-spacing:.06em;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:none;backdrop-filter:none}
.gcode[hidden]{display:none}
.gcode.copied{color:var(--acc)}
.stats table{width:100%;border-collapse:collapse;margin:6px 0 10px}
.stats th,.stats td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stats th{font-weight:600;color:var(--muted);font-size:.8rem}
.stats td:last-child,.stats th:last-child{text-align:right}
.stats h3{margin:14px 0 2px;font-size:.95rem}
.stats .codecopy{min-height:0;padding:2px 0;border:0;background:transparent;box-shadow:none;color:var(--muted);font-size:.78rem;
  letter-spacing:.05em;-webkit-backdrop-filter:none;backdrop-filter:none;text-align:left}
.stats .codecopy.copied{color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-height:700px){#app{gap:6px} #play,#side{gap:6px} #pad{width:min(100%,230px);padding:6px;gap:5px} #pad button{font-size:1.25rem;aspect-ratio:1.9} #boardwrap{width:min(100%,560px,calc(100vh - 324px));width:min(100%,560px,calc(100dvh - 324px))}}
</style>
</head>
<body>
<div id="app">
  <section id="home" aria-labelledby="home-title">
    <div id="logo" class="logo"></div>
    <h1 id="home-title">5ud0ku</h1>
    <nav class="homemenu">
      <button id="h-new" class="big"></button>
      <button id="h-continue" class="big" hidden></button>
      <button id="h-options" class="big"></button>
      <button id="h-stats" class="big"></button>
      <button id="h-help" class="big"></button>
    </nav>
    <p class="foot" id="h-foot"><span id="h-ver"></span><br><span id="h-inspired"></span></p>
  </section>
  <header>
    <button id="b-menu" class="iconbtn"></button>
    <span id="g-info"><span id="clock" aria-live="off">0:00</span><button id="g-code" class="gcode" hidden></button><span id="g-level"></span></span>
    <span class="grow"></span>
    <button id="b-pause" class="iconbtn"></button>
  </header>
  <main id="play">
    <div id="boardwrap">
      <div id="board" role="grid"></div>
      <div id="pause" hidden><span id="pause-text"></span><button id="b-resume" class="primary"></button></div>
      <div id="busy" hidden></div>
    </div>
    <div id="side">
      <div id="tools">
        <button id="b-undo"></button>
        <button id="b-redo"></button>
        <button id="b-notes" aria-pressed="false"></button>
        <button id="b-test" aria-pressed="false"></button>
        <button id="b-erase"></button>
      </div>
      <div id="pad" role="group"></div>
      <p id="padhint" aria-live="polite"></p>
    </div>
  </main>
  <div id="live" class="sr" aria-live="polite"></div>
</div>

<dialog id="menu" aria-labelledby="menu-title">
  <h2 id="menu-title"></h2>
  <div class="menu">
    <button id="m-resume" class="primary"></button>
    <button id="m-home"></button>
    <button id="m-restart"></button>
    <button id="m-share"></button>
    <button id="m-enter"></button>
    <button id="m-stats"></button>
    <button id="m-options"></button>
    <button id="m-help"></button>
    <button id="m-about"></button>
  </div>
</dialog>



<dialog id="newgame" aria-labelledby="new-title">
  <h2 id="new-title"></h2>
  <div class="diffs" id="diffs" role="radiogroup"></div>
  <p class="hint" id="new-daily-info"></p>
  <div class="row"><button id="new-daily"></button><button id="new-enter"></button></div>
  <div class="row"><button id="new-cancel"></button><button id="new-start" class="primary"></button></div>
</dialog>

<dialog id="done" aria-labelledby="done-title">
  <h2 id="done-title"></h2>
  <p id="done-text"></p>
  <p id="done-record"></p>
  <div class="row"><button id="done-close"></button><button id="done-new" class="primary"></button></div>
</dialog>

<dialog id="share" aria-labelledby="share-title">
  <h2 id="share-title"></h2>
  <p id="share-text"></p>
  <div id="share-wrap5">
    <p class="lbl" id="share-lbl5"></p>
    <div class="code" id="share-code5"></div>
    <div class="row"><button id="share-copy5"></button></div>
  </div>
  <p class="lbl" id="share-lblhash"></p>
  <div class="code" id="share-code"></div>
  <div class="row"><button id="share-copy"></button></div>
  <div class="row"><button id="share-close" class="primary"></button></div>
</dialog>

<dialog id="stats" aria-labelledby="stats-title">
  <h2 id="stats-title"></h2>
  <div id="stats-body" class="stats"></div>
  <div class="row"><button id="stats-reset"></button><button id="stats-close" class="primary"></button></div>
</dialog>

<dialog id="enter" aria-labelledby="enter-title">
  <h2 id="enter-title"></h2>
  <p id="enter-text"></p>
  <textarea id="enter-field" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
  <p class="err-msg" id="enter-err" hidden></p>
  <div class="row"><button id="enter-close"></button><button id="enter-start" class="primary"></button></div>
</dialog>

<dialog id="options" aria-labelledby="options-title">
  <h2 id="options-title"></h2>
  <div id="options-body"></div>
  <div class="row"><button id="options-close" class="primary"></button></div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <h2 id="help-title"></h2>
  <p id="help-1"></p><p id="help-2"></p><p id="help-3"></p><p id="help-4"></p>
  <div class="row"><button id="help-about"></button><button id="help-close" class="primary"></button></div>
</dialog>

<dialog id="about" aria-labelledby="about-title">
  <h2 id="about-title"></h2>
  <p id="about-text"></p>
  <p id="about-version"></p>
  <p><a id="about-code" href="https://github.com/tiberius-claudius-drusus/5ud0ku" target="_blank" rel="noopener"></a> · <a id="about-licence" href="LICENSE.txt" target="_blank" rel="noopener"></a></p>
  <div class="row"><button id="about-close" class="primary"></button></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
