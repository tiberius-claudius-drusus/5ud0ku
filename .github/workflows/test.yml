name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Tests unitaires (sans navigateur). Le banc d'essai Chrome (`npm run e2e`) reste un outil local.
      - run: node --test
